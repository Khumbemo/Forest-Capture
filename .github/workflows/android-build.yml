name: Android CI Build

on:
  push:
    branches: [ "main", "release" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Install NPM Dependencies
      run: npm install

    # npm install on this runner doesn't set the executable bit on
    # node_modules/.bin/* shims (reproduced locally: `cap sync android`
    # fails with "Permission denied" until this is applied) — this has
    # broken every build in the workflow's history, unrelated to any
    # particular change.
    - name: Fix npm bin executable bits
      run: chmod +x node_modules/.bin/*

    - name: Run Unit Tests
      run: npm run test:unit

    - name: Run E2E Tests
      run: npm run test:e2e

    - name: Build Web Assets & Sync Capacitor
      run: npm run cap:sync

    - name: Build Android Debug APK
      working-directory: ./android
      run: |
        sudo apt-get update && sudo apt-get install -y dos2unix
        dos2unix ./gradlew
        chmod +x ./gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: forest-capture-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30
